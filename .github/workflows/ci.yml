# shellcheck and shfmt over the shell scripts, and a workflow lint. The scripts are never run.
# The jobs live in ChiefGyk3D/git-your-ship-together; this file only says what
# is specific to update-proton-ge.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/bash-ci.yml@9e0d7b2e7e8530e2b1bb200ecb4fbf6de021881f # v1.38.0
    permissions:
      contents: read
    with:
      egress-policy: block
